[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mlt"
version = "0.1.0"
description = "Config-driven starter kit for ML competitions: folds, training, OOF predictions, ensembles and submissions."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Alban NYANTUDRE" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "catboost>=1.2.5",
]

[project.optional-dependencies]
tune = ["optuna>=3.6"]
nn = ["torch>=2.3"]
text = ["torch>=2.3", "transformers>=4.44"]
vision = ["torch>=2.3", "timm>=1.0", "albumentations>=1.4", "pillow>=10"]
segmentation = ["mlt[vision]", "segmentation-models-pytorch>=0.3.4"]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
eda = ["matplotlib>=3.8", "seaborn>=0.13", "ipykernel>=6.29"]
all = ["mlt[tune,nn,text,vision,segmentation,serve,eda]"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "nbformat>=5.9", "nbclient>=0.10"]

[project.scripts]
mlt = "mlt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mlt"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "torch: needs the nn/text/vision extras",
    "network: downloads data or pretrained weights",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
