# BiLSTM over word ids. Point features.text.embeddings at a fastText .vec file to use
# pretrained vectors (e.g. crawl-300d-2M.vec); without it the embeddings are learned.
extends: newsgroups_tfidf.yaml
model:
  name: bilstm
  params:
    hidden: 64
    embed_dim: 100
train:
  epochs: 8
  batch_size: 32
  lr: 2.0e-3
  max_len: 200
  patience: 2
